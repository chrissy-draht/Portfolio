<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CodeBunker 404 Kontaktformular</title>
    </head>

    <body>

        <header>

            <!-- Aufgabe 1: Hauptüberschrift erstellen -->
           <h1 style="color:#ffffff;">CodeBunker 404 - Geheime Hacker-Zentrale</h1>

            <img src="./medien/ChatGPT Image 9. Juni 2026, 13_03_57.png" alt="Logo CodeBunker 404" width="250" class="logo">
            <style>

            header {
                text-align: center;
                padding: 2rem;
                background: linear-gradient(135deg, #0f172a, #14532d);
                border-radius: 15px;
                box-shadow: 0 0 25px rgba(20, 83, 45, 0.5);
            }
        
            .logo {
                width: 250px;
                height: auto;
                border-radius: 50%;
                border: 4px solid #00ff99;
                box-shadow: 0 0 20px #00ff99;
            }
        
            input:focus, textarea:focus, select:focus {
                outline: none;
                border: 2px solid #00ff99;
                box-shadow: 0 0 10px #00ff99;
            }

            section {
                background: linear-gradient(135deg, #0f172a, #123524);
                color: #e5e7eb;
                padding: 35px;
                border-radius: 18px;
                box-shadow: 0 0 25px rgba(0, 0, 0, 0.35);
                max-width: 900px;
                margin: 25px auto;
                border-left: 6px solid #00ff99;
            }

            input, select, textarea {
                padding: 8px;
                border: 1px solid #14532d;
                border-radius: 6px;
            }

            button {
                background-color: #14532d;
                color: white;
                padding: 10px 15px;
                border: none;
                border-radius: 8px;
            }

            button:hover {
                background-color: #0f4430;
            }
            </style>

            <!-- Aufgabe 2: Begrüßungstext erstellen -->
          

            <p style="color:white; font-size:23px;">
                Willkommen im CodeBunker 404. <br>
                Hier können Besucher eine Anfrage an das Support-Team der Hacker-Zentrale senden.
            </p>

        </header>

        <main>

            <section>

                <h2>Support-Anfrage</h2>

                <!-- Aufgabe 3: Formular erstellen -->
                <form>

                    <!-- Aufgabe 4: Eingabefeld für den Codenamen -->
                    <p>
                        <label for="codename">Codename: </label>
                        <input type="text" name="codename" id="codename">
                    </p>

                    <!-- Aufgabe 5: Eingabefeld für die E-Mail-Adresse -->
                    <p>
                        <label for="email">E-Mail: </label>
                        <input type="email" name="email" id="email">
                    </p>

                    <!-- Bonus: Passwortfeld -->
                    <p>
                        <label for="passwort">Geheimes Codewort: </label>
                        <input type="password" name="passwort" id="passwort" required>
                    </p>

                    <!-- Aufgabe 6: Auswahlfeld für den Grund der Anfrage -->
                    <p>
                        <label for="grund">Grund der Anfrage: </label>

                        <select name="grund" id="grund" required>
                            <option value="" disabled selected>Bitte auswählen</option>
                            <option value="passwort">Passwort vergessen</option>
                            <option value="firewall">Firewall zu streng</option>
                            <option value="server">Server macht komische Geräusche</option>
                            <option value="kaffee">Kaffeeautomat offline</option>
                            <option value="allgemein">Allgemeine Anfrage</option>
                        </select>
                    </p>

                    <!-- Aufgabe 7: Radiobuttons für die Dringlichkeit -->
                    <h3>Dringlichkeit</h3>

                    <p>
                        <input type="radio" name="dringlichkeit" id="niedrig" value="niedrig">
                        <label for="niedrig">Niedrig</label>

                        <br>

                        <input type="radio" name="dringlichkeit" id="mittel" value="mittel">
                        <label for="mittel">Mittel</label>

                        <br>

                        <input type="radio" name="dringlichkeit" id="hoch" value="hoch">
                        <label for="hoch">Hoch</label>

                        <br>

                        <input type="radio" name="dringlichkeit" id="brennt" value="brennt">
                        <label for="brennt">System brennt</label>
                    </p>

                    <!-- Aufgabe 8: Checkboxen für betroffene Bereiche -->
                    <h3>Betroffene Bereiche</h3>

                    <p>
                        <input type="checkbox" name="bereich" id="laptop">
                        <label for="laptop">Laptop</label>

                        <br>

                        <input type="checkbox" name="bereich" id="server">
                        <label for="server">Server</label>

                        <br>

                        <input type="checkbox" name="bereich" id="netzwerk">
                        <label for="netzwerk">Netzwerk</label>

                        <br>

                        <input type="checkbox" name="bereich" id="datenbank">
                        <label for="datenbank">Datenbank</label>

                        <br>

                        <input type="checkbox" name="bereich" id="kaffeemaschine">
                        <label for="kaffeemaschine">Kaffeemaschine</label>
                    </p>

                    <!-- Aufgabe 9: Mehrzeiliges Texteingabefeld -->
                    <p>
                        <label for="nachricht">Nachricht: </label>

                        <br>

                        <textarea name="nachricht" id="nachricht" cols="50" rows="5"></textarea>
                    </p>

                    <!-- Aufgabe 10: Datumsfeld -->
                    <p>
                        <label for="datum">Problem besteht seit: </label>
                        <input type="date" name="datum" id="datum">
                    </p>

                    <!-- Aufgabe 11: Absende-Button -->
                    <button type="submit">Anfrage verschlüsselt senden</button>

                </form>

            </section>

        </main>

    </body>
</html>
